name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Get example dependencies
        if: hashFiles('example/pubspec.yaml') != ''
        working-directory: example
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Analyze example
        if: hashFiles('example/pubspec.yaml') != ''
        working-directory: example
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test

      # Last on purpose: pub warns (exit 65) when checked-in files are modified,
      # so nothing after this point may touch tracked files.
      - name: Publish dry-run
        run: dart pub publish --dry-run
